[package]
name = "PhotoKiosk"
version = "0.1.0"
edition = "2021"

[features]
default = []
kbdhook = []            # экспериментальный перехват Alt+Tab/Win (Windows)
turbo = ["turbojpeg"]   # быстрый JPEG-декод (нужны cmake + nasm)

[dependencies]
eframe = "0.31"
egui = "0.31"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
walkdir = "2"
blake3 = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg","png","webp","bmp","tiff"] }
fast_image_resize = "5"
turbojpeg = { version = "1", optional = true }
rayon = "1"
crossbeam-channel = "0.5"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = "1"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std","clock","serde"] }
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation","Win32_System_Power","Win32_System_Registry", "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse"
]}

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
